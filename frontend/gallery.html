<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0c0e" />
    <title>Projects — Scene Foundry</title>
  </head>
  <body>
    <div id="app">
      <div class="gallery-page" data-template="gallery">
        <aside class="gallery-sidebar">
          <header class="panel-header"><a class="wordmark" href="/">Scene Foundry</a><a class="text-link" href="/">New scene</a></header>
          <div class="gallery-intro"><span class="preview-kicker">Project archive</span><h1>Saved worlds.</h1><p>Open a completed generation, inspect it in the sandbox, or reuse its brief.</p></div>
          <div id="project-grid" class="project-grid" aria-live="polite"></div>
          <button id="load-more-projects" class="secondary-button" type="button">Load more</button>
        </aside>
        <main class="gallery-preview">
          <header class="preview-header"><div><span class="preview-kicker">Selected scene</span><strong id="gallery-preview-title">Choose a project</strong></div><a id="reuse-project" class="secondary-button" href="/" hidden>Fork / iterate</a></header>
          <div class="preview-stage"><div id="gallery-empty-preview" class="empty-state"><span class="empty-mark" aria-hidden="true">S/F</span><p>Select a project from the archive.</p></div><iframe id="gallery-preview-frame" title="Saved scene preview" sandbox="allow-scripts"></iframe></div>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
